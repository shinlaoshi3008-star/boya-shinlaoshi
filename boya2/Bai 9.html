<p><b>Cấu tạo:</b> do bổ ngữ kết quả hoặc bổ ngữ xu hướng đảm nhiệm.</p></div>
<div class="grid">
<div class="card"><div class="ex" style="border:0;margin:0;padding:0"><div class="z">太远了，我看不清楚黑板上的字。</div><div class="p">Tài yuǎn le, wǒ kàn bù qīngchu hēibǎn shàng de zì.</div><div class="v">Xa quá, tôi không nhìn rõ chữ trên bảng.</div></div></div>
<div class="card"><div class="ex" style="border:0;margin:0;padding:0"><div class="z">我说的话你听得懂听不懂？— 我听得懂。</div><div class="p">Wǒ shuō de huà nǐ tīng de dǒng tīng bù dǒng? — Wǒ tīng de dǒng.</div><div class="v">Lời tôi nói bạn nghe có hiểu không? – Tôi hiểu.</div></div></div>
<div class="card"><div class="ex" style="border:0;margin:0;padding:0"><div class="z">你做的菜有点儿多，恐怕吃不完。</div><div class="p">Nǐ zuò de cài yǒudiǎnr duō, kǒngpà chī bù wán.</div><div class="v">Bạn nấu nhiều đồ quá, sợ là ăn không hết.</div></div></div>
<div class="card"><div class="ex" style="border:0;margin:0;padding:0"><div class="z">那座山真高啊，我爬不上去。</div><div class="p">Nà zuò shān zhēn gāo a, wǒ pá bú shàngqù.</div><div class="v">Ngọn núi kia cao quá, tôi không leo lên được.</div></div></div></div>`);
S.push(`<h2>语法重点 <small>2. 往 + 方位词 / 处所词 + V</small></h2>
<div class="box"><h3>2. 往 + 方位词 / 处所词 + V</h3><p>Kết cấu chỉ <b>hướng</b> của động tác.</p><div class="formula"><span class="han">往</span> + phương vị từ / từ chỉ nơi chốn + V</div>
<div class="ex"><div class="z">从山上往下看，风景美极了！</div><div class="p">Cóng shānshàng wǎng xià kàn, fēngjǐng měi jí le!</div><div class="v">Đứng từ trên núi nhìn xuống, phong cảnh đẹp vô cùng!</div></div>
<div class="ex"><div class="z">你到前边的楼又往左拐就到。</div><div class="p">Nǐ dào qiánbian de lóu yòu wǎng zuǒ guǎi jiù dào.</div><div class="v">Đến tòa nhà phía trước, bạn rẽ trái tiếp là tới.</div></div>
<div class="ex"><div class="z">小鸟往天上飞去了。</div><div class="p">Xiǎo niǎo wǎng tiānshàng fēi qù le.</div><div class="v">Con chim nhỏ bay lên trời rồi.</div></div></div>
`);
S.push(`<h2>语法重点 <small>3. V 来 V 去</small></h2>
<div class="box"><h3>3. V 来 V 去</h3><p>Diễn tả hành động <b>lặp đi lặp lại</b>.</p><div class="formula">V <span class="han">来</span> V <span class="han">去</span></div>
<div class="ex"><div class="z">他在房间里走来走去，不知道是想什么呢。</div><div class="p">Tā zài fángjiān lǐ zǒu lái zǒu qù, bù zhīdào shì xiǎng shénme ne.</div><div class="v">Anh ta đi đi lại lại trong phòng, không biết đang nghĩ gì.</div></div>
<div class="ex"><div class="z">这本书太难了，我看来看去也看不懂。</div><div class="p">Zhè běn shū tài nán le, wǒ kàn lái kàn qù yě kàn bù dǒng.</div><div class="v">Quyển sách này khó quá, tôi đọc đi đọc lại cũng không hiểu.</div></div>
<div class="ex"><div class="z">那只蚊子飞来飞去，我打不了它。</div><div class="p">Nà zhī wénzi fēi lái fēi qù, wǒ dǎ bù liǎo tā.</div><div class="v">Con muỗi kia bay qua bay lại, tôi không đập được nó.</div></div></div>`);
S.push(`<h2>课文内容 <small>Bài khóa</small></h2>
<div class="box"><div class="z han" style="font-size:32px;line-height:1.8">李军出去忘了带房间钥匙，回去的时候进不去房间。他要进去看足球比赛，他怕来不及，就从隔壁水房的窗户爬过去的。不过往房间里跳时，不小心摔倒了，他的腿现在一拐一拐的。</div>
<p style="color:#4F7A4A">Lǐ Jūn chūqù wàng le dài fángjiān yàoshi, huíqù de shíhou jìn bú qù fángjiān. Tā yào jìnqù kàn zúqiú bǐsài, tā pà láibují, jiù cóng gébì shuǐfáng de chuānghu pá guòqù de. Búguò wǎng fángjiān lǐ tiào shí, bù xiǎoxīn shuāidǎo le, tā de tuǐ xiànzài yì guǎi yì guǎi de.</p></div>
`);
S.push(`<h2>回答问题 <small>Trả lời câu hỏi theo bài khóa</small></h2>
${QA.map((q,i)=>`<div class="box"><div class="q"><b>${i+1}.</b> <span class="han">${q[0]}</span><br><span style="color:#4F7A4A;font-size:21px">${q[1]}</span></div>${rv(`<span class="han">${q[2]}</span><div class="p">${q[3]}</div>`)}</div>`).join('')}`);

const sh=x=>{x=[...x];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const head=(t,sb,n)=>`<h2>${t}</h2><p class="sub">${sb}</p><div class="bar"><span class="score">Điểm: <b>0</b> / ${n}</span><button class="rv" onclick="rst(this)">↻ Làm lại</button></div>`;
const mc=(o,c,fb)=>`<div class="mc" data-c="${c}">${o.map((t,j)=>`<button class="opt han" data-j="${j}"><b>${'ABCD'[j]}.</b> ${t}</button>`).join('')}<div class="ans">${fb}</div></div>`;
const E3W=[["我认识这些字，我念不得出来。","我认识这些字，我不能念得出来。"],["我搬动不得这张桌子。","我不搬得动这张桌子。"],["我不看得见黑板上的字。","我看见不黑板上的字。"],["我这个人不说得好中文。","我这个人说得不好中文。"],["这个教室坐得下坐得不下三十个学生？","这个教室坐不得下三十个学生吗？"],["明天早上我不来得了。","明天早上我来了不。"],["这个电话号码你记不得住记得住？","这个电话号码你记住得不记住得？"],["我不猜得着这个谜语。","我猜着不这个谜语。"]];
S.push(()=>head('练习一 <small>Bài 1: Sắp xếp câu</small>','Bấm vào các từ để xếp thành câu đúng, rồi bấm “Kiểm tra”',6)+E1.map((e,i)=>`<div class="box sent" data-a="${e[1].replace(/[。？]/g,'')}" data-r="${e[1]}|${e[2]}"><div class="q"><b>${i+1}.</b> Câu của bạn:</div><div class="line han"></div><div class="pool han">${e[0].split('　').map(w=>`<button class="chip">${w}</button>`).join('')}</div><button class="rv chk">Kiểm tra</button><div class="ans"></div></div>`).join(''));
S.push(()=>head('练习二 <small>Bài 2: Chọn đáp án đúng</small>','Bấm vào đáp án bạn chọn',4)+E2.map((e,i)=>`<div class="box"><div class="q"><b>${i+1}.</b> <span class="han">${e[0]}</span></div>${mc(e[1],e[2],`✔ Đáp án: <b>${'ABCD'[e[2]]}.</b> <span class="han">${e[1][e[2]]}</span><div class="p">${e[3]}</div>`)}</div>`).join(''));
S.push(()=>head('练习三 <small>Bài 3: Chữa lỗi sai</small>','Câu bên dưới có lỗi. Hãy chọn câu đã sửa đúng',8)+E3.map((e,i)=>{const o=sh([e[1],...E3W[i]]);return `<div class="box"><div class="q"><b>${i+1}.</b> Câu sai: <span class="wrong">${e[0]}</span></div>${mc(o,o.indexOf(e[1]),`✔ Đáp án: <span class="han">${e[1]}</span><div class="p">${e[2]}</div>`)}</div>`}).join('')+`<div class="hero" style="min-height:0;margin-top:20px"><svg style="width:120px;height:120px"><use href="#panda"/></svg><div class="han" style="font-size:36px;color:#B22A1F;font-weight:900">加油！Cố lên nhé!</div></div>`);

const deck=document.getElementById('deck'),dots=document.getElementById('dots'),ov=document.getElementById('ov'),pn=document.getElementById('pn'),G=[];
S.forEach((h,i)=>{G[i]=typeof h==='function'?h:()=>h;const sc=document.createElement('section');sc.className='slide';sc.innerHTML=G[i]();deck.appendChild(sc);const d=document.createElement('i');d.onclick=()=>go(i);dots.appendChild(d)});
let cur=0,ck='N',ci=0;
const TABS=[{n:'Từ mới',h:'生词',items:[['Danh từ 名词',1],['Động từ 动词',2],['Hình dung từ 形容词',3],['Từ loại khác 其他',4]]},
{n:'Ngữ pháp',h:'语法',items:[['1. Bổ ngữ khả năng',5],['2. 往 + phương vị từ',6],['3. V 来 V 去',7]]},
{n:'Bài khóa',h:'课文',items:[['Nội dung bài khóa',8],['Trả lời câu hỏi',9]]},
{n:'Luyện tập',h:'练习',items:[['Bài 1: Sắp xếp câu',10],['Bài 2: Chọn đáp án',11],['Bài 3: Chữa lỗi sai',12]]}];
const tabsEl=document.getElementById('tabs'),sb=document.getElementById('sb');let curT=-1;
tabsEl.innerHTML=TABS.map((t,i)=>`<button data-t="${i}"><span class="han">${t.h}</span> ${t.n}</button>`).join('');
tabsEl.onclick=e=>{const b=e.target.closest('button');if(b)go(TABS[+b.dataset.t].items[0][1])};
sb.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.s)};
function go(n){cur=Math.max(0,Math.min(S.length-1,n));[...deck.children].forEach((e,i)=>{e.classList.toggle('on',i===cur);if(i===cur)e.scrollTop=0});[...dots.children].forEach((e,i)=>e.classList.toggle('on',i===cur));
 const ti=TABS.findIndex(t=>t.items.some(x=>x[1]===cur));[...tabsEl.children].forEach((b,i)=>b.classList.toggle('on',i===ti));
 if(ti!==curT){curT=ti;if(ti<0)sb.classList.remove('on');else{sb.innerHTML=`<div><h4 class="han">${TABS[ti].h} · ${TABS[ti].n}</h4>${TABS[ti].items.map(x=>`<button data-s="${x[1]}">${x[0]}</button>`).join('')}</div>`;sb.classList.add('on')}}
 sb.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s===cur));
 prev.disabled=cur===0;next.disabled=cur===S.length-1;location.hash=cur+1}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
const pt=el=>{const b=el.closest('.slide').querySelector('.score b');b.textContent=+b.textContent+1};
function rst(b){const sc=b.closest('.slide'),i=[...deck.children].indexOf(sc);sc.style.opacity=0;setTimeout(()=>{sc.innerHTML=G[i]();sc.scrollTop=0;sc.style.opacity=''},450)}
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};
let WR=[];
function drawW(t){const box=document.getElementById('cw');if(!box)return;WR.forEach(x=>{try{x.pauseAnimation()}catch(e){}});WR=[];box.innerHTML='';
 if(typeof HanziWriter==='undefined'){box.innerHTML='<div class="note">Cần kết nối Internet để xem hoạt hình nét viết.</div>';return}
 [...t].forEach(ch=>{const d=document.createElement('div');d.className='cw';box.appendChild(d);
  try{const wr=HanziWriter.create(d,ch,{width:176,height:176,padding:10,strokeColor:'#B22A1F',radicalColor:'#4F7A4A',outlineColor:'#E2D2AE',strokeAnimationSpeed:1,delayBetweenStrokes:350,delayBetweenLoops:1400,showCharacter:false,onLoadCharDataError:()=>{d.innerHTML='<div class="note" style="padding:10px">Không tải được dữ liệu nét viết</div>'}});WR.push(wr);wr.loopCharacterAnimation()}catch(e){}})}
function fillW(){const w=GR[ck][ci],h=H[w[0]];pn.innerHTML=`<button class="x" onclick="closeW()">✕</button><div class="pl"><div class="w"><span class="z" style="font-size:84px">${w[0]}</span><span class="p" style="font-size:36px">${w[1]}</span><button class="rv" onclick="say('${w[0]}')">🔊 Nghe</button></div><div style="margin:8px 0"><span class="tag">Âm Hán Việt</span><b style="font-size:32px;color:var(--red2)">${h[0]}</b></div><div class="vi" style="font-size:32px">${w[2]}</div>${w[3]?`<div class="note">▸ ${w[3]}</div>`:''}<h3>Ví dụ (trình độ HSK 3)</h3>${h[1].map(x=>{const q=x.split('|');return `<div class="ex"><div class="z">${q[0]}</div><div class="p">${q[1]}</div><div class="v">${q[2]}</div></div>`}).join('')}<h3>Ví dụ trong bài</h3><div class="ex"><div class="z">${w[4]}</div><div class="p">${w[5]}</div><div class="v">${w[6]}</div></div><div class="mnav"><button class="rv" onclick="stepW(-1)">◀ Từ trước</button><span>${ci+1} / ${GR[ck].length}</span><button class="rv" onclick="stepW(1)">Từ sau ▶</button></div></div><div class="pr"><h3 style="margin-top:0">✍️ Cách viết · thứ tự nét</h3><div id="cw" class="cws"></div><button class="rv" onclick="drawW('${w[0]}')">↻ Xem lại</button><p class="note" style="margin-top:12px">Hoạt hình tự lặp lại: viết từng nét theo đúng thứ tự.</p></div>`;drawW(w[0])}
function showW(k,i,o){ck=k;ci=i;if(o){fillW();pn.scrollTop=0;ov.classList.add('on')}else{pn.classList.add('sw');setTimeout(()=>{fillW();pn.scrollTop=0;pn.classList.remove('sw')},260)}}
function stepW(d){const n=GR[ck].length;showW(ck,(ci+d+n)%n)}
function closeW(){ov.classList.remove('on');try{speechSynthesis.cancel()}catch(e){}}
ov.onclick=e=>{if(e.target===ov)closeW()};
deck.addEventListener('click',e=>{
 const c=e.target.closest('.chip');
 if(c){const b=c.closest('.sent');if(b.dataset.done)return;const ln=b.querySelector('.line'),pl=b.querySelector('.pool');(c.parentNode===pl?ln:pl).appendChild(c);b.querySelector('.ans').classList.remove('show');return}
 const k=e.target.closest('.chk');
 if(k){const b=k.closest('.sent'),a=b.querySelector('.ans'),u=[...b.querySelectorAll('.line .chip')].map(x=>x.textContent).join(''),ok=u===b.dataset.a,r=b.dataset.r.split('|');
  a.className='ans show '+(ok?'good':'badc');a.innerHTML=ok?`✔ Chính xác!<div class="han" style="font-size:30px">${r[0]}</div><div class="p">${r[1]}</div>`:'✘ Chưa đúng, hãy sắp xếp lại nhé!';
  if(ok){b.dataset.done=1;pt(b)}return}
 const o=e.target.closest('.opt');
 if(o){const m=o.closest('.mc');if(m.classList.contains('done'))return;m.classList.add('done');const c2=+m.dataset.c,j=+o.dataset.j;[...m.querySelectorAll('.opt')].forEach((x,n)=>{if(n===c2)x.classList.add('ok');else if(n===j)x.classList.add('bad')});m.querySelector('.ans').classList.add('show');if(j===c2)pt(m);return}
 const w=e.target.closest('.card[data-k]');if(w)showW(w.dataset.k,+w.dataset.i,true)
});
addEventListener('keydown',e=>{const m=ov.classList.contains('on');if(e.key==='Escape')closeW();if(m){if(e.key==='ArrowRight')stepW(1);if(e.key==='ArrowLeft')stepW(-1);return}if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
go((parseInt(location.hash.slice(1))||1)-1);
</script>
