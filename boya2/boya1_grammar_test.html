<!DOCTYPE html>

<head>

<title>Ôn Tập Ngữ Pháp Boya 1</title>

<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface-2: #f1efe9;
    --border: #e4ddd0;
    --text: #2b2620;
    --text-dim: #6f6656;
    --accent: #b5482b;
    --accent-soft: #f4e2da;
    --accent-2: #2c6e5c;
    --accent-2-soft: #dcece5;
    --correct: #2c7a4b;
    --correct-bg: #e5f4e9;
    --wrong: #c23b3b;
    --wrong-bg: #fbe8e6;
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b17; --surface: #262320; --surface-2: #2f2b26; --border: #423c33;
      --text: #f1ece2; --text-dim: #b5ab98; --accent: #e2764f; --accent-soft: #3d2a22;
      --accent-2: #6db79b; --accent-2-soft: #223a32;
      --correct: #7ed6a0; --correct-bg: #1f3a2a; --wrong: #f29b9b; --wrong-bg: #402323;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b17; --surface: #262320; --surface-2: #2f2b26; --border: #423c33;
    --text: #f1ece2; --text-dim: #b5ab98; --accent: #e2764f; --accent-soft: #3d2a22;
    --accent-2: #6db79b; --accent-2-soft: #223a32;
    --correct: #7ed6a0; --correct-bg: #1f3a2a; --wrong: #f29b9b; --wrong-bg: #402323;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; line-height:1.55; }
  .cjk { font-family:'Noto Sans SC','Inter',sans-serif; }
  .wrap { max-width: 880px; margin:0 auto; padding: 26px 16px 80px; }
  header.page-header { text-align:center; margin-bottom: 20px; }
  header.page-header h1 { font-size: 1.4rem; margin:0 0 6px; letter-spacing:-0.01em; }
  header.page-header p { margin:0; color:var(--text-dim); font-size:0.92rem; }

  .main-tabs { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; -webkit-overflow-scrolling: touch; }
  .main-tab-btn { flex:0 0 auto; padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-weight:600; font-size:0.85rem; cursor:pointer; white-space:nowrap; }
  .main-tab-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  .topic-panel { display:none; }
  .topic-panel.active { display:block; }

  .dang-intro { background:var(--accent-soft); border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; font-size:0.9rem; }
  .dang-intro b { color:var(--accent); }
  .sub-head { font-weight:700; font-size:0.95rem; margin: 18px 0 10px; color:var(--accent-2); }
  .sub-head:first-child { margin-top:0; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 17px; margin-bottom:11px; }
  .q-num { display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:24px; padding:0 6px; border-radius:8px; background:var(--accent-2-soft); color:var(--accent-2); font-weight:700; font-size:0.78rem; margin-right:8px; flex:0 0 auto; }
  .q-row { display:flex; align-items:flex-start; }
  .q-body { flex:1; min-width:0; }
  .q-text { font-size:1.02rem; margin-bottom:8px; }

  .blank-input { width:60px; border:none; border-bottom:2px solid var(--accent); background:transparent; color:var(--text); font-family:'Noto Sans SC','Inter',sans-serif; font-size:1rem; text-align:center; padding:2px 4px; margin:0 2px; }
  .blank-input:focus { outline:none; border-color:var(--accent-2); }
  .blank-input.correct { border-color:var(--correct); background:var(--correct-bg); }
  .blank-input.wrong { border-color:var(--wrong); background:var(--wrong-bg); }

  textarea.free-input, input.free-input { width:100%; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); color:var(--text); font-family:'Noto Sans SC','Inter',sans-serif; font-size:0.98rem; padding:8px 10px; resize:vertical; }
  textarea.free-input:focus, input.free-input:focus { outline:none; border-color:var(--accent-2); }

  .row-actions { display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--border); border-radius:8px; padding:6px 13px; font-size:0.81rem; font-weight:600; cursor:pointer; background:var(--surface-2); color:var(--text); }
  .btn.primary { background:var(--accent-2); color:#fff; border-color:var(--accent-2); }
  .verdict { font-size:0.81rem; font-weight:600; }
  .verdict.ok { color:var(--correct); }
  .verdict.bad { color:var(--wrong); }

  .answer-box { display:none; margin-top:9px; background:var(--accent-2-soft); border-radius:9px; padding:9px 12px; font-size:0.9rem; }
  .answer-box.show { display:block; }
  .answer-box.wrong-tint { background:var(--wrong-bg); }
  .answer-box .label { font-weight:700; color:var(--accent-2); margin-right:4px; }
  .answer-box .label.wrong-label { color:var(--wrong); }
  .answer-box .explain { color:var(--text-dim); margin-top:4px; font-size:0.84rem; }

  .letter-badge { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 3px; border-radius:5px; background:var(--surface-2); border:1px solid var(--border); font-weight:700; font-size:0.78rem; margin:0 2px; color:var(--text-dim); }
  .letter-badge.pickable { cursor:pointer; }
  .letter-badge.selected { background:var(--accent); border-color:var(--accent); color:#fff; }
  .letter-badge.correct { background:var(--correct); border-color:var(--correct); color:#fff; }
  .letter-badge.wrong { background:var(--wrong); border-color:var(--wrong); color:#fff; }
  select.pos-select { font-family:'Noto Sans SC','Inter',sans-serif; border:1px solid var(--accent); border-radius:6px; padding:2px 4px; font-size:0.88rem; background:var(--surface); color:var(--text); margin:0 2px 4px; }
  select.pos-select.correct { border-color:var(--correct); background:var(--correct-bg); }
  select.pos-select.wrong { border-color:var(--wrong); background:var(--wrong-bg); }

  .section-footer { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 17px; margin: 4px 0 20px; }
  .score-display { font-weight:700; font-size:0.92rem; }
  .score-display span { color:var(--accent); }

  .qgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .qgrid .mini-item { display:flex; align-items:center; font-size:0.95rem; }
  .qgrid .mini-num { color:var(--text-dim); font-size:0.8rem; margin-right:4px; min-width:16px; }

  footer.page-footer { text-align:center; color:var(--text-dim); font-size:0.78rem; margin-top:26px; }
</style>
</head>

</div>

/* ================= RENDER HELPERS ================= */
function renderFillText(text, qid) {
  const parts = text.split("___");
  let html = "";
  for (let i=0;i<parts.length;i++){
    html += `<span class="cjk">${parts[i]}</span>`;
    if (i < parts.length-1) html += `<input type="text" class="blank-input cjk" id="${qid}-b${i}" maxlength="4" autocomplete="off">`;
  }
  return html;
}

function correctionCard(topicId, q, idx, keyPrefix){
  const qid = `${topicId}-${keyPrefix||'c'}-${idx}`;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-row">
      <span class="q-num">${q.num}</span>
      <div class="q-body">
        <div class="q-text cjk">${q.text}</div>
        <textarea class="free-input cjk" id="${qid}-input" rows="2" placeholder="Viết lại câu đúng..."></textarea>
        <div class="row-actions">
          <button class="btn" data-reveal="${qid}">Xem đáp án</button>
        </div>
        <div class="answer-box" id="${qid}-answer">
          <span class="label">Đáp án:</span><span class="cjk">${q.answer}</span>
          ${q.explain ? `<div class="explain">${q.explain}</div>` : ""}
        </div>
      </div>
    </div>`;
  return card;
}

function sampleCard(topicId, q, idx){
  const qid = `${topicId}-s-${idx}`;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-row">
      <span class="q-num">${q.num}</span>
      <div class="q-body">
        <div class="q-text cjk">${q.text}</div>
        <textarea class="free-input cjk" id="${qid}-input" rows="2" placeholder="Viết câu của bạn..."></textarea>
        <div class="row-actions">
          <button class="btn" data-reveal="${qid}">Xem đáp án mẫu</button>
        </div>
        <div class="answer-box" id="${qid}-answer">
          <span class="label">Đáp án mẫu:</span><span class="cjk">${q.sample}</span>
          ${q.explain ? `<div class="explain">${q.explain}</div>` : ""}
        </div>
      </div>
    </div>`;
  return card;
}

function fillCard(topicId, q, idx, keyPrefix){
  const qid = `${topicId}-${keyPrefix||'f'}-${idx}`;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-row">
      <span class="q-num">${q.num}</span>
      <div class="q-body">
        <div class="q-text cjk">${renderFillText(q.text, qid)}</div>
        <div class="answer-box" id="${qid}-explain">
          <span class="label">Đáp án đúng:</span><span class="cjk">${q.blanks.map(b=>b.join(" / ")).join(" ; ")}</span>
          ${q.explain ? `<div class="explain">${q.explain}</div>` : ""}
        </div>
      </div>
    </div>`;
  return card;
}

function letterPickCard(topicId, q, idx){
  const qid = `${topicId}-lp-${idx}`;
  const parts = q.text.split(/([A-Z])/);
  let html = "";
  parts.forEach(p=>{
    if (/^[A-Z]$/.test(p)) html += `<span class="letter-badge pickable" data-letter="${p}" data-qid="${qid}">${p}</span>`;
    else html += `<span class="cjk">${p}</span>`;
  });
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-row">
      <span class="q-num">${q.num}</span>
      <div class="q-body">
        <div class="q-text cjk">${html}</div>
        <div class="row-actions">
          <button class="btn primary" data-checklp="${qid}">Kiểm tra</button>
          <span class="verdict" id="${qid}-verdict"></span>
        </div>
        <div class="answer-box" id="${qid}-answer">
          <span class="label">Vị trí đúng:</span> ${q.answer}
          ${q.explain ? `<div class="explain">${q.explain}</div>` : ""}
        </div>
      </div>
    </div>`;
  card.dataset.answer = q.answer;
  return card;
}

function letterFillCard(topicId, q, idx){
  const qid = `${topicId}-lf-${idx}`;
  const parts = q.text.split(/([A-Z])/);
  let html = "";
  parts.forEach(p=>{
    if (/^[A-Z]$/.test(p)){
      if (q.blanks[p]){
        const opts = q.pool.map(w=>`<option value="${w}">${w}</option>`).join("");
        html += `<span class="letter-badge">${p}</span><select class="pos-select cjk" id="${qid}-${p}"><option value="">–</option>${opts}</select>`;
      } else {
        html += `<span class="letter-badge">${p}</span>`;
      }
    } else html += `<span class="cjk">${p}</span>`;
  });
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="q-row">
      <span class="q-num">${q.num}</span>
      <div class="q-body">
        <div class="q-text cjk">${html}</div>
        <div class="row-actions">
          <button class="btn primary" data-checklf="${qid}">Kiểm tra</button>
          <span class="verdict" id="${qid}-verdict"></span>
        </div>
        <div class="answer-box" id="${qid}-answer">
          <span class="label">Đáp án:</span> ${Object.entries(q.blanks).map(([k,v])=>`${k}=${v}`).join(", ")}
          ${q.explain ? `<div class="explain">${q.explain}</div>` : ""}
        </div>
      </div>
    </div>`;
  card.dataset.qref = JSON.stringify(q.blanks);
  return card;
}

/* ================= BUILD PAGE ================= */
const mainTabsEl = document.getElementById("mainTabs");
const topicPanelsEl = document.getElementById("topicPanels");

TOPICS.forEach((topic, ti) => {
  const btn = document.createElement("button");
  btn.className = "main-tab-btn" + (ti===0 ? " active":"");
  btn.textContent = topic.label;
  btn.onclick = () => selectTopic(topic.id);
  mainTabsEl.appendChild(btn);

  const panel = document.createElement("section");
  panel.className = "topic-panel" + (ti===0 ? " active":"");
  panel.id = "topic-" + topic.id;
  panel.innerHTML = `<div class="dang-intro cjk"><b>${topic.label}</b> — ${topic.intro}</div>`;

  if (topic.type === "correction") {
    topic.items.forEach((q,idx)=> panel.appendChild(correctionCard(topic.id,q,idx)));
  } else if (topic.type === "sample") {
    topic.items.forEach((q,idx)=> panel.appendChild(sampleCard(topic.id,q,idx)));
  } else if (topic.type === "fill") {
    topic.items.forEach((q,idx)=> panel.appendChild(fillCard(topic.id,q,idx)));
    const footer = document.createElement("div");
    footer.className = "section-footer";
    footer.innerHTML = `<div class="score-display" id="score-${topic.id}">Chưa chấm</div><button class="btn primary" id="check-${topic.id}">Kiểm tra đáp án</button>`;
    panel.appendChild(footer);
  } else if (topic.type === "letterPick") {
    topic.items.forEach((q,idx)=> panel.appendChild(letterPickCard(topic.id,q,idx)));
  } else if (topic.type === "letterFill") {
    topic.items.forEach((q,idx)=> panel.appendChild(letterFillCard(topic.id,q,idx)));
  } else if (topic.type === "mixed") {
    const h1 = document.createElement("div");
    h1.className = "sub-head cjk";
    h1.textContent = "练习1：改错句";
    panel.appendChild(h1);
    topic.correction.forEach((q,idx)=> panel.appendChild(correctionCard(topic.id,q,idx,'c1')));

    const h2 = document.createElement("div");
    h2.className = "sub-head cjk";
    h2.textContent = "练习2：填上适当的结果补语";
    panel.appendChild(h2);
    topic.fill.forEach((q,idx)=> panel.appendChild(fillCard(topic.id,q,idx,'f2')));
    const footer = document.createElement("div");
    footer.className = "section-footer";
    footer.innerHTML = `<div class="score-display" id="score-${topic.id}">Chưa chấm</div><button class="btn primary" id="check-${topic.id}">Kiểm tra đáp án (Bài 2)</button>`;
    panel.appendChild(footer);
  }

  topicPanelsEl.appendChild(panel);
});

/* ================= INTERACTIONS ================= */
function selectTopic(id){
  document.querySelectorAll(".main-tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".topic-panel").forEach(p=>p.classList.remove("active"));
  [...mainTabsEl.children].forEach(b=>{ if (b.textContent === TOPICS.find(t=>t.id===id).label) b.classList.add("active"); });
  document.getElementById("topic-"+id).classList.add("active");
}

// reveal (correction & sample)
document.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-reveal]");
  if (!btn) return;
  const qid = btn.dataset.reveal;
  const box = document.getElementById(`${qid}-answer`);
  box.classList.toggle("show");
  btn.textContent = box.classList.contains("show") ? "Ẩn đáp án" : btn.textContent.replace("Ẩn","Xem");
});

// fill-type check (per topic, including 'mixed' fill section num2)
TOPICS.forEach(topic=>{
  if (topic.type === "fill"){
    document.getElementById(`check-${topic.id}`).addEventListener("click", ()=>{
      let correct=0, total=0;
      topic.items.forEach((q,idx)=>{
        const qid = `${topic.id}-f-${idx}`;
        let allOk = true;
        q.blanks.forEach((accepted,i)=>{
          total++;
          const input = document.getElementById(`${qid}-b${i}`);
          const ok = accepted.some(a=>norm(a)===norm(input.value));
          input.classList.remove("correct","wrong");
          input.classList.add(ok?"correct":"wrong");
          if (ok) correct++; else allOk = false;
        });
        document.getElementById(`${qid}-explain`).classList.toggle("show", !allOk);
      });
      document.getElementById(`score-${topic.id}`).innerHTML = `Kết quả: <span>${correct}/${total}</span> đúng`;
    });
  }
  if (topic.type === "mixed"){
    document.getElementById(`check-${topic.id}`).addEventListener("click", ()=>{
      let correct=0, total=0;
      topic.fill.forEach((q,idx)=>{
        const qid = `${topic.id}-f2-${idx}`;
        let allOk = true;
        q.blanks.forEach((accepted,i)=>{
          total++;
          const input = document.getElementById(`${qid}-b${i}`);
          const ok = accepted.some(a=>norm(a)===norm(input.value));
          input.classList.remove("correct","wrong");
          input.classList.add(ok?"correct":"wrong");
          if (ok) correct++; else allOk = false;
        });
        document.getElementById(`${qid}-explain`).classList.toggle("show", !allOk);
      });
      document.getElementById(`score-${topic.id}`).innerHTML = `Kết quả: <span>${correct}/${total}</span> đúng (Bài 2)`;
    });
  }
});

// letterPick: select letter
document.addEventListener("click", (e)=>{
  const badge = e.target.closest(".letter-badge.pickable");
  if (!badge) return;
  const qid = badge.dataset.qid;
  document.querySelectorAll(`.letter-badge[data-qid="${qid}"]`).forEach(b=>b.classList.remove("selected","correct","wrong"));
  badge.classList.add("selected");
});

// letterPick: check
document.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-checklp]");
  if (!btn) return;
  const qid = btn.dataset.checklp;
  const card = btn.closest(".card");
  const answer = card.dataset.answer;
  const selected = card.querySelector(".letter-badge.selected");
  const verdict = document.getElementById(`${qid}-verdict`);
  const answerBox = document.getElementById(`${qid}-answer`);
  if (!selected){
    verdict.textContent = "Hãy chọn một vị trí trước.";
    verdict.className = "verdict bad";
    return;
  }
  const chosen = selected.dataset.letter;
  const ok = chosen === answer;
  card.querySelectorAll(".letter-badge").forEach(b=>{
    b.classList.remove("correct","wrong");
    if (b.dataset.letter === answer) b.classList.add("correct");
    else if (b === selected && !ok) b.classList.add("wrong");
  });
  verdict.textContent = ok ? "✓ Chính xác!" : "✗ Chưa đúng — xem đáp án bên dưới";
  verdict.className = "verdict " + (ok?"ok":"bad");
  answerBox.classList.toggle("show", true);
  answerBox.classList.toggle("wrong-tint", !ok);
});

// letterFill: check
document.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-checklf]");
  if (!btn) return;
  const qid = btn.dataset.checklf;
  const card = btn.closest(".card");
  const blanks = JSON.parse(card.dataset.qref);
  const verdict = document.getElementById(`${qid}-verdict`);
  const answerBox = document.getElementById(`${qid}-answer`);
  let allOk = true;
  Object.entries(blanks).forEach(([label, word])=>{
    const sel = document.getElementById(`${qid}-${label}`);
    const ok = sel.value === word;
    sel.classList.remove("correct","wrong");
    sel.classList.add(ok?"correct":"wrong");
    if (!ok) allOk = false;
  });
  verdict.textContent = allOk ? "✓ Chính xác!" : "✗ Còn chỗ chưa đúng — xem đáp án bên dưới";
  verdict.className = "verdict " + (allOk?"ok":"bad");
  answerBox.classList.toggle("show", true);
  answerBox.classList.toggle("wrong-tint", !allOk);
});
