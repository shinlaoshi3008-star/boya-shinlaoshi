const G={"1":["快 / 快要…了","快 / 快要 + V + 了","Sắp xảy ra: 快放假了, 快要毕业了. Còn 快 + số lượng + 了 là gần đạt tới: 待了快半年了.","<em>快</em>放假<em>了</em>；待了<em>快</em>半年<em>了</em>"],"2":["虽然…但(是)…","虽然 + vế nhượng bộ，但 + vế chính","\"Mặc dù… nhưng…\". Vế sau thường có 但 hoặc 不过. Không dùng 因为 hay 所以 thay cho 虽然.","<em>虽然</em>只考三门课，<em>但</em>有些课只需要写报告。"],"3":["因为…(所以…)","因为 + nguyên nhân","Nêu nguyên nhân. 因为 có thể đứng ở vế sau để bổ sung lý do, và có thể đi với 所以.","大卫打算去旅行，<em>因为</em>他在中国待了快半年了。"],"4":["对…感兴趣","S + 对 + đối tượng + 感兴趣","Hứng thú với điều gì. Đối tượng đặt sau 对, có thể thêm 很/非常 trước 感兴趣.","李军<em>对</em>中国古代历史非常<em>感兴趣</em>。"],"5":["除了…(还/也)…","除了 + A，(S) 还/也 + B","Ngoài A ra còn có B.","<em>除了</em>学习，李军<em>还</em>想着回家。"],"6":["既要…也要…","既要 + A，也要 + B","Vừa phải A, vừa phải B: hai việc cần làm cùng lúc.","<em>既要</em>努力学习，<em>也要</em>多陪陪家人。"],"7":["V一下 / V + V","V + 一下；V + V","Làm nhẹ, làm thử, giọng mềm. 看看, 陪陪 tương đương 看一下, 陪一下.","欣赏<em>一下</em>雪景；<em>看看</em>爸爸妈妈"],"8":["一直 + V","S + 一直 + V","Suốt, luôn luôn không đổi.","他<em>一直</em>在北京。"],"9":["在…期间","在 + danh từ + 期间，…","Trong thời gian…","<em>在</em>考试<em>期间</em>，同学们都很紧张。"],"10":["已经…了 / V了 + số lượng","已经 + V + 了；V + 了 + số lượng","已经…了: việc đã xảy ra. Khi có số lượng, 了 đứng ngay sau động từ.","<em>已经</em>开始考试<em>了</em>；考<em>了</em>两门"],"11":["就","S + 就 + V","Nhấn mạnh sắp xong, chỉ còn một chút: chỉ còn một môn là kết thúc.","这个星期还有一门<em>就</em>结束了。"],"12":["不要让…(太…了)","不要 + V；不要让 + O + adj + 了","不要 là \"đừng\". 让自己太累了 = để bản thân quá mệt.","<em>不要让</em>自己太累了。"],"13":["V得 + bổ ngữ trạng thái","S + V + 得 + adj","Đánh giá việc làm tốt hay xấu. Phủ định: V得不…","她考<em>得</em>不太好。"],"14":["V + 完 (bổ ngữ kết quả)","V + 完；没 + V + 完","Làm xong. Phủ định dùng 没.","一道阅读题也没做<em>完</em>。"],"15":["对于…来说","对于 + đối tượng + 来说，…","Đối với… mà nói, nêu góc nhìn của một nhóm người.","<em>对于</em>外国学生<em>来说</em>，汉字确实有很多困难。"],"16":["更好地 + V","更 + adj + 地 + V","Tính từ + 地 đứng trước động từ làm trạng ngữ. 更好地 là một cách tốt hơn.","希望能<em>更好地</em>记住汉字。"],"101":["因为…所以… / 由于","因为 + nguyên nhân，所以 + kết quả","因为 nêu nguyên nhân, 所以 nêu kết quả. Có thể dùng một vế. 因为 cũng đứng ở vế sau để bổ sung lý do. 由于 trang trọng hơn, đi với 所以 hoặc đứng một mình. Không dùng 虽然 (\"mặc dù\") cho quan hệ nhân quả.","<em>因为</em>手机没电，<em>所以</em>没接电话。","Vì điện thoại hết pin nên không nghe máy."],"102":["V + 了 (hoàn thành)","S + V + 了 + số lượng + O","了 đặt ngay sau động từ để nói hành động đã xảy ra. Khi có thời lượng, phải có 了: 看了一个上午的书, không nói 看一个上午书.","她看<em>了</em>一个上午的书。","Cô ấy đã đọc sách cả buổi sáng."],"103":["没(有) + V","S + 没(有) + V","Phủ định hành động đã xảy ra dùng 没(有), không dùng 不, và bỏ 了. 没接电话 = không nghe máy.","她<em>没有</em>接电话。","Cô ấy không nghe máy."],"104":["快 / 要 + V + 了","快 / 要 + V + 了","Diễn tả việc sắp xảy ra. Cuối câu phải có 了. 快 thường đi với thời điểm gần, 要 nói chung.","圣诞节<em>快</em>到<em>了</em>，新年也<em>要</em>来<em>了</em>。","Giáng sinh sắp đến, năm mới cũng sắp tới."],"105":["在 + V (đang)","S + 在 + V + O","在 đứng trước động từ để nói hành động đang diễn ra.","中村<em>在</em>给朋友写明信片。","中村 đang viết bưu thiếp cho bạn."],"106":["刚 + V (vừa)","S + 刚 + V","刚 đứng sau chủ ngữ, trước động từ, nói việc vừa mới xảy ra.","她<em>刚</em>去买邮票。","Cô ấy vừa đi mua tem."],"107":["请 / 让 + O + V","S + 请/让 + người + V","Người bị nhờ hoặc bị bảo đứng giữa. 请 là mời, rủ (lịch sự). 让 là bảo, để. Sai thường gặp: 请一起玛丽.","大卫<em>请</em>玛丽跟他一起去。","大卫 rủ 玛丽 đi cùng anh."],"108":["跟…一起 + V","S + 跟 + người + 一起 + V","Làm việc gì cùng ai. 跟 + người đứng trước 一起, cả cụm đứng trước động từ.","<em>跟</em>他<em>一起</em>去","Đi cùng anh ấy"],"109":["V + 一下","V + 一下","Làm một chút, làm thử. Giọng nói nhẹ nhàng, thường dùng khi nêu ý định hoặc đề nghị.","考虑<em>一下</em>","Cân nhắc một chút"],"110":["就 (ngay, thì)","S + 就 + V","就 đứng trước động từ, nhấn mạnh việc xảy ra sớm hoặc ngay sau một điều kiện.","下个周末<em>就</em>出发。","Cuối tuần sau là xuất phát ngay."]};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=/(\*?)([\u4e00-\u9fff]+)\{([^|}]*)(?:\|([^}]*))?\}/g;
const hue=i=>(i*137.5+20)%360,ABC="ABCD",B=$("#B");
const html=(t,hm)=>t.replace(/«(\d+)/g,(_,d)=>`<span class="g" data-g="${d}" style="--h:${hm[d]}">`).replace(/»/g,"</span>").replace(W,(_,s,h,p,m)=>`<w class="${s?"nw":""}" data-p="${p||""}" data-m="${m||""}">${h}</w>`);
function para(p,k){
  const hm={};p.g.forEach((id,i)=>hm[id]=hue(i));
  const m=new Map();(p.t+p.x).replace(W,(a,s,h,py,mn)=>{if(s&&!m.has(h))m.set(h,[py,mn||""])});
  const v=[...m].map(([h,[py,mn]])=>`<li tabindex="0" data-h="${h}" data-p="${py}" data-m="${mn}"><b>${h}</b><small>${py}</small><span>${mn}</span></li>`).join("");
  const g=p.g.map(id=>{const e=G[id];return `<div class="gc" tabindex="0" data-g="${id}" style="--h:${hm[id]}"><h4>${e[0]}</h4><span class="f">${e[1]}</span><p>${e[2]}</p><div class="ex">${e[3]}${e[4]?`<small>${e[4]}</small>`:""}</div></div>`}).join("");
  return `<section class="para"><h2>Đoạn ${k+1}</h2><div class="main"><div class="box"><div class="T">${html(p.t,hm)}</div><div class="lk">Bấm vào một từ trong đoạn để tra.</div></div><div class="box"><h3>Từ mới</h3><ul class="V">${v}</ul></div></div><div class="box"><h3>Ngữ pháp đoạn ${k+1}</h3><div class="G">${g}</div></div></section>`;
}
function show(n){
  const b=BOOKS[n];
  $$("#tabs button").forEach((x,k)=>x.classList.toggle("on",k===n));
  const x=b.ex.map(e=>Array.isArray(e[1])
    ?`<div><p class="q">${e[0]}</p><div class="opts">${e[1].map((o,k)=>`<button class="opt" ${k===e[2]?'data-ok="1"':""}>${ABC[k]}. ${o}</button>`).join("")}</div></div>`
    :`<div class="ans" tabindex="0"><p class="q">${e[0]}</p><p class="a">${e[1]}</p></div>`).join("");
  const audio=`<section class="box"><h3>Nghe bài đọc ${b.n}</h3><audio controls preload="none" style="width:100%" src="audio/bai${b.n}.mp3">Trình duyệt không hỗ trợ phát audio.</audio></section>`;
  B.innerHTML=audio+b.ps.map(para).join("")+`<section class="box"><h3>Luyện tập: ${b.xt}</h3><div class="X">${x}</div></section>`;
  scrollTo(0,0);
}
const clr=pr=>$$("w.sel,.V li.sel",pr).forEach(x=>x.classList.remove("sel"));
const look=(pr,h,p,m)=>$(".lk",pr).innerHTML=`<b>${h}</b><i>${p||""}</i>${m||"(hư từ, trợ từ)"}`;
function pin(pr,id){
  const c=$(`.gc[data-g="${id}"]`,pr),on=!c.classList.contains("hot");
  $$(".hot",pr).forEach(x=>x.classList.remove("hot"));
  if(on){c.classList.add("hot");$$(`.g[data-g="${id}"]`,pr).forEach(x=>x.classList.add("hot"));}
}
$("#tabs").innerHTML=BOOKS.map(b=>`<button>Bài đọc ${b.n}</button>`).join("")+`<label><input type="checkbox" id="py"> Hiện pinyin</label>`;
$$("#tabs button").forEach((b,k)=>b.onclick=()=>show(k));
$("#py").onchange=e=>document.body.classList.toggle("py",e.target.checked);
B.addEventListener("click",e=>{
  const t=e.target,pr=t.closest(".para"),w=t.closest("w"),li=t.closest("li"),g=t.closest(".g"),c=t.closest(".gc"),a=t.closest(".ans"),o=t.closest(".opt");
  if(pr){
    if(w){clr(pr);w.classList.add("sel");look(pr,w.textContent,w.dataset.p,w.dataset.m);}
    if(li){clr(pr);li.classList.add("sel");$$(".T w",pr).forEach(x=>{if(x.textContent===li.dataset.h)x.classList.add("sel")});look(pr,li.dataset.h,li.dataset.p,li.dataset.m);}
    if(g)pin(pr,g.dataset.g);
    if(c)pin(pr,c.dataset.g);
  }
  if(a)a.classList.toggle("on");
  if(o){o.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("ok","no"));o.classList.add(o.dataset.ok?"ok":"no");}
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Enter"&&e.target.matches("li,.gc,.ans"))e.target.click();
  const i=$$("#tabs button").findIndex(b=>b.classList.contains("on"));
  if(e.key==="ArrowRight"&&i<BOOKS.length-1)show(i+1);
  if(e.key==="ArrowLeft"&&i>0)show(i-1);
});
show(0);
</script>
