<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博雅汉语 · Bài 4 · 图书馆在哪儿</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#F0F4F7;
  --paper-deep:#E1E9EE;
  --ink:#22303C;
  --ink-soft:#5D6E7B;
  --card:#FFFFFF;
  --line:#D7E0E6;
  --accent:#5C8FBF;
  --accent-soft:#DCE8F3;
  --jade:#2F6B7D;
  --jade-soft:#D8EAEF;
  --red:#C0614F;
  --red-soft:#F6E2DC;
  --shadow: 0 10px 30px rgba(39,49,64,0.07);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;position:relative;overflow-x:hidden;}
.hanzi{font-family:'Noto Serif SC',serif;}
.zh{font-family:'Noto Sans SC','Inter',sans-serif;}

.season-blob{position:fixed;width:460px;height:460px;border-radius:50%;filter:blur(110px);opacity:.32;z-index:-1;transition:background-color .8s ease;pointer-events:none;}
#blob1{top:-150px;left:60px;}
#blob2{bottom:-170px;right:-90px;}

#app{max-width:1120px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 18px 90px;}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.lib-back{display:flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink-soft);border:1px solid var(--line);background:var(--card);padding:6px 12px 6px 9px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:var(--shadow);transition:.15s;margin-right:6px;}
.lib-back:hover{color:var(--ink);border-color:var(--accent);}
.lib-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.fs-btn{border:1px solid var(--line);background:var(--card);color:var(--ink-soft);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:.15s;}
.fs-btn:hover{color:var(--ink);border-color:var(--accent);}
.fs-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.fs-exit{position:fixed;top:16px;right:16px;z-index:80;display:none;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;font-size:16px;}
.fs-exit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
body.presentation .fs-exit{display:flex;}
body.presentation{background:#0B0F14;}
body.presentation #app{max-width:100%;padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
body.presentation header,body.presentation #reviewTabs{display:none;}
body.presentation main{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;}
body.presentation #stage{aspect-ratio:unset;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
body.presentation .slide{aspect-ratio:16/9;width:min(100vw,177.78vh);height:min(100vh,56.25vw);margin:auto;border-radius:0;box-shadow:none;}
body.presentation footer{background:transparent;padding:0 0 22px;}
body.presentation .dots span{background:rgba(255,255,255,.3);}
body.presentation .dots span.active{background:#fff;}
body.presentation .nav-btn{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);opacity:.55;transition:opacity .2s;}
body.presentation .nav-btn:hover{opacity:1;}
body.presentation .season-blob{display:none;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .side-mark{font-family:'Noto Serif SC',serif;font-weight:900;font-size:18px;background:var(--ink);color:var(--paper);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 32px;}
.brand .txt small{display:block;color:var(--ink-soft);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.brand .txt strong{font-size:15px;letter-spacing:.01em;}

.weather-badge{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:var(--shadow);}
.weather-badge .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:700;font-size:13px;color:#fff;transition:background-color .6s;}
.weather-badge span{font-size:12px;color:var(--ink-soft);}

.mode-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
.mode-switch button{border:none;background:transparent;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-soft);transition:.2s;display:flex;align-items:center;gap:6px;}
.mode-switch button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}
.mode-switch button.active{background:var(--ink);color:var(--paper);}

#reviewTabs{display:none;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.review-tab{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;box-shadow:var(--shadow);}
.review-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

main{flex:1;display:flex;flex-direction:column;}
#stage{width:100%;aspect-ratio:16/9;}
.slide{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 44px;width:100%;height:100%;display:flex;flex-direction:column;gap:16px;animation:fade .35s ease;overflow-y:auto;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;filter:brightness(.75);}
.slide h2{margin:0;font-family:'Noto Serif SC',serif;font-size:24px;}

.cover{padding:0;overflow:hidden;justify-content:center;background:linear-gradient(158deg,#E4EFF8 0%,#EDF5EF 48%,#FBF1E3 100%);}
.cover-lattice{position:absolute;width:200px;height:200px;opacity:.16;z-index:1;color:#273140;}
.cover-lattice svg{width:100%;height:100%;}
.corner-tl{top:-40px;left:-40px;}
.corner-br{bottom:-40px;right:-40px;transform:rotate(180deg);}
.cover-sticker{position:absolute;z-index:2;filter:drop-shadow(0 6px 10px rgba(39,49,64,.15));}
.cover-sticker .float-inner{animation:floaty 4.5s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.s1{width:66px;height:66px;top:6%;left:5%;transform:rotate(-10deg);}
.s2{width:72px;height:72px;top:7%;right:7%;transform:rotate(12deg);}
.s3{width:52px;height:52px;bottom:10%;left:7%;transform:rotate(-14deg);}
.s4{width:56px;height:56px;bottom:9%;right:9%;transform:rotate(10deg);}
.s5{width:44px;height:44px;top:40%;left:2.5%;transform:rotate(-6deg);opacity:.9;}
.s6{width:48px;height:48px;top:36%;right:3%;transform:rotate(8deg);opacity:.9;}
.cover-card{position:relative;z-index:3;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-radius:22px;padding:26px 44px;box-shadow:0 14px 34px rgba(39,49,64,.1);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 auto;max-width:480px;}
.cover-card .num{font-family:'Noto Serif SC',serif;font-weight:900;font-size:48px;-webkit-text-stroke:2px var(--accent);color:transparent;line-height:1;}
.cover-card .title-zh{font-family:'Noto Serif SC',serif;font-weight:900;font-size:34px;margin:2px 0;}
.cover-card .title-py{color:var(--ink-soft);font-size:13px;letter-spacing:.04em;}
.cover-card .sub{margin-top:8px;font-size:12.5px;color:var(--ink-soft);background:var(--paper-deep);padding:5px 14px;border-radius:999px;}

.corner-sticker{position:absolute;top:14px;right:26px;width:112px;height:112px;z-index:6;animation:stickerFloat 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(39,49,64,.2));}
.corner-sticker .sun{position:absolute;inset:6%;border-radius:50%;background:repeating-conic-gradient(#FFE7A8 0deg 11.25deg, #FFD16B 11.25deg 22.5deg);opacity:.72;}
.corner-sticker .ring{position:absolute;inset:2%;border-radius:50%;border:2px dashed rgba(255,255,255,.95);}
.corner-sticker .art{position:absolute;inset:0;}
.corner-sticker .art img{position:absolute;left:0;top:2%;width:100%;height:100%;object-fit:contain;object-position:center bottom;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 84%,transparent 99%);mask-image:linear-gradient(180deg,#000 0%,#000 84%,transparent 99%);}
@keyframes stickerFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-5px) rotate(2deg);}}

.dline{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);}
.dline:last-child{border-bottom:none;}
.dline .spk{flex:0 0 66px;font-weight:700;font-size:12.5px;color:var(--jade);padding-top:4px;}
.dline .content{flex:1;}
.dline .h{font-family:'Noto Serif SC',serif;font-size:19px;line-height:1.45;}
.dline .p{color:var(--ink-soft);font-size:12px;margin-top:3px;}
.dline .vi{font-size:12px;margin-top:5px;color:var(--ink);background:var(--paper-deep);display:inline-block;padding:2px 9px;border-radius:8px;}
#dialogueBlock.hide-py .p{display:none;}
#dialogueBlock.hide-vi .vi{display:none;}
.speak-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12px;flex:0 0 28px;}
.speak-btn:hover{background:var(--accent-soft);}
.dialogue-toolbar{display:flex;gap:10px;flex-wrap:wrap;}
.vword{border-bottom:2px dotted var(--accent);cursor:pointer;padding:0 1px;border-radius:3px;transition:.15s;}
.vword:hover{background:var(--accent-soft);}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:2px;padding-top:12px;border-top:1px solid var(--line);}
.chip-label{font-size:11.5px;color:var(--ink-soft);margin-right:2px;}
.vchip{border:1px solid var(--line);background:var(--paper);padding:4px 11px;border-radius:999px;font-family:'Noto Serif SC',serif;font-size:14px;cursor:pointer;transition:.15s;}
.vchip:hover{background:var(--accent-soft);border-color:var(--accent);}

.gram-section{display:flex;flex-direction:column;gap:14px;padding-top:14px;border-top:1px solid var(--line);}
.gram-card{display:flex;flex-direction:column;gap:6px;}
.gram-title{font-family:'Noto Serif SC',serif;font-size:15.5px;font-weight:700;}
.gexample{font-family:'Noto Serif SC',serif;font-size:18px;background:var(--jade-soft);padding:10px 14px;border-radius:12px;border-left:4px solid var(--jade);}
.gexplain{font-size:13.3px;line-height:1.55;}
.gmore{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
.gmore li{font-family:'Noto Serif SC',serif;font-size:14.5px;background:var(--paper-deep);padding:6px 12px;border-radius:10px;}

.reveal-btn{align-self:flex-start;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:600;}
.reveal-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.reveal-btn.small{padding:5px 12px;font-size:11.5px;}

.reorder-item{border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--paper);display:flex;flex-direction:column;gap:8px;transition:background-color .35s ease,border-color .35s ease;}
.reorder-item.correct{border-color:var(--jade);background:var(--jade-soft);animation:pulseCorrect .45s ease;}
.reorder-item.wrong{border-color:var(--red);background:var(--red-soft);animation:shakeWrong .45s ease;}
.reorder-idx{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.reorder-answer{min-height:38px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:6px 9px;background:#fff;transition:background-color .3s ease,border-color .3s ease;}
.reorder-answer .placeholder{font-size:12.5px;color:var(--ink-soft);transition:opacity .25s ease;}
.reorder-bank{display:flex;flex-wrap:wrap;gap:7px;}
.chunk{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-family:'Noto Serif SC',serif;font-size:15px;cursor:pointer;background:#fff;transition:transform .15s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease;animation:chunkPop .28s cubic-bezier(.34,1.56,.64,1);will-change:transform;}
.chunk:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(39,49,64,.1);}
.chunk:active{transform:translateY(0) scale(.96);}
.chunk.ans{background:var(--accent-soft);border-color:var(--accent);animation:chunkDrop .28s cubic-bezier(.34,1.56,.64,1);}
.chunk.bank:hover{background:var(--accent-soft);}
.reorder-actions{display:flex;align-items:center;gap:10px;}
.fb-note{font-size:12.5px;font-weight:600;animation:fbIn .3s ease;}
@keyframes chunkPop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
@keyframes chunkDrop{0%{opacity:0;transform:translateY(-10px) scale(.85);}60%{opacity:1;transform:translateY(2px) scale(1.03);}100%{transform:translateY(0) scale(1);}}
@keyframes shakeWrong{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes pulseCorrect{0%{transform:scale(1);}35%{transform:scale(1.015);}100%{transform:scale(1);}}
@keyframes fbIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:translateY(0);}}

.translate-item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:8px;}
.translate-vi{font-size:14px;font-weight:600;}
.translate-input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:'Noto Serif SC',serif;font-size:15px;width:100%;resize:none;background:#fff;}
.translate-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.translate-feedback{font-size:12.5px;font-weight:600;}
.translate-answer{display:none;background:var(--jade-soft);border:1px solid var(--jade);border-radius:10px;padding:9px 13px;}
.translate-answer.shown{display:block;}
.translate-answer .h{font-family:'Noto Serif SC',serif;font-size:16.5px;}
.translate-answer .p{font-size:12px;color:var(--jade);margin-top:2px;}
.translate-item.t-correct{border-color:var(--jade);}
.translate-item.t-wrong{border-color:var(--red);}

.speak-topic{border:1px solid var(--line);background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.speak-q{font-size:13.5px;}
.speak-guide{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-family:'Noto Serif SC',serif;font-size:14.5px;}
.speak-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.speak-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.speak-card .ic{width:44px;height:44px;}
.speak-card .name{font-family:'Noto Serif SC',serif;font-size:14.5px;font-weight:700;}
.speak-card .q{font-size:11px;color:var(--ink-soft);}
.pattern-box{border:1px solid var(--line);background:var(--paper-deep);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;}

footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(244,245,241,0),var(--paper) 30%);padding:16px 0 20px;z-index:9;}
.nav-wrap{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 18px;}
.nav-btn{border:none;background:var(--ink);color:var(--paper);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:15px;flex:0 0 40px;box-shadow:var(--shadow);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;}
.dots span.active{background:var(--accent);width:22px;border-radius:5px;filter:brightness(.8);}

.vmodal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;}
.vmodal-backdrop{position:absolute;inset:0;background:rgba(39,49,64,.55);opacity:0;transition:opacity .3s;}
.vmodal.open .vmodal-backdrop{opacity:1;}
.vmodal-card{position:relative;width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.28);transform:scale(.82) translateY(18px);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .28s;}
.vmodal.open .vmodal-card{transform:scale(1) translateY(0);opacity:1;}
.vmodal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:14px;z-index:2;}
.vmodal-close:hover{background:var(--accent-soft);}
.vmodal-body{display:flex;align-items:stretch;}
.vmodal-left{flex:2;padding:34px 30px;display:flex;flex-direction:column;gap:14px;}
.vmodal-right{flex:1;background:var(--paper-deep);padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-left:1px solid var(--line);}
.vword-hanzi{font-family:'Noto Serif SC',serif;font-weight:900;font-size:48px;}
.vword-pinyin{color:var(--accent);filter:brightness(.7);font-size:17px;}
.vword-hanviet{font-size:13px;color:var(--ink-soft);}
.vword-pos{display:inline-block;font-size:11px;text-transform:uppercase;background:var(--paper-deep);padding:2px 8px;border-radius:6px;color:var(--ink-soft);width:fit-content;}
.vword-meaning,.vword-usage{font-size:14.5px;line-height:1.65;}
.radical-box{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:14px;padding:12px 16px;}
.radical-badge{font-size:26px;background:#fff;border:1px solid var(--line);border-radius:10px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:0 0 46px;}
.radical-text{flex:1;}
.radical-name{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.mnemonic-text{font-size:13.5px;line-height:1.55;margin-top:2px;}
.radical-icon{width:44px;height:44px;flex:0 0 44px;}
.radical-icon svg{width:100%;height:100%;}
.vword-examples{display:flex;flex-direction:column;gap:10px;margin-top:2px;}
.ex-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
.ex-h{font-size:18px;}
.ex-p{font-size:12.5px;color:var(--accent);filter:brightness(.7);margin-top:2px;}
.ex-vi{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.stroke-col{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;}
.stroke-box{display:flex;flex-direction:column;align-items:center;gap:6px;}
.stroke-target{background:#fff;border:1px solid var(--line);border-radius:12px;width:110px;height:110px;}
.stroke-char{font-size:13px;color:var(--ink-soft);}


.fill-group{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:11px;}
.fill-bank{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding-bottom:9px;border-bottom:1px dashed var(--line);}
.fill-bank .bank-label{font-size:11.5px;color:var(--ink-soft);margin-right:2px;}
.fillchip{border:1px dashed var(--accent);background:var(--accent-soft);padding:4px 12px;border-radius:999px;font-family:'Noto Serif SC',serif;font-size:14.5px;}
.fill-rows{display:flex;flex-direction:column;gap:9px;}
.fill-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fill-idx{font-size:11.5px;font-weight:700;color:var(--ink-soft);flex:0 0 20px;}
.fill-sent{font-family:'Noto Serif SC',serif;font-size:16.5px;line-height:1.9;}
.fill-input{border:none;border-bottom:2px solid var(--accent);background:transparent;font-family:'Noto Serif SC',serif;font-size:16px;width:74px;text-align:center;padding:1px 3px;outline:none;color:var(--ink);}
.fill-input:focus{border-bottom-color:var(--jade);background:var(--accent-soft);border-radius:6px 6px 0 0;}
.fill-input.ok{border-bottom-color:var(--jade);color:var(--jade);font-weight:700;}
.fill-input.no{border-bottom-color:var(--red);color:var(--red);}
.fill-fb{font-size:12px;font-weight:600;}
.fill-hint{font-size:11.5px;color:var(--ink-soft);}

/* ---------- STATE ---------- */
let section = 'new';
let currentNew = 0;
let currentReview = 0;

function activeSlides(){ return section==='new' ? slidesNew : slidesReview; }
function getCurrent(){ return section==='new' ? currentNew : currentReview; }
function setCurrent(i){ if(section==='new') currentNew=i; else currentReview=i; }

function normalizeStr(s){ return (s||'').replace(/[，。？！,.\?!\s]/g,'').toLowerCase(); }

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.92;
  const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith('zh'));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function speakSequence(lines){
  speechSynthesis.cancel();
  lines.forEach(l=>{
    const u = new SpeechSynthesisUtterance(l);
    u.lang='zh-CN'; u.rate=0.92;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith('zh'));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  });
}

function renderDialogue(s){
  const lines = s.lines.map(l=>{
    const segHtml = l.segments.map(sg=> sg.v ? `<span class="vword" data-word="${sg.v}">${sg.t}</span>` : `<span>${sg.t}</span>`).join('');
    const plain = l.segments.map(sg=>sg.t).join('');
    return `<div class="dline">
      <div class="spk zh">${l.spk}</div>
      <div class="content">
        <div class="h hanzi">${segHtml}</div>
        <div class="p">${l.p}</div>
        <div class="vi">${l.vi}</div>
      </div>
      <button class="speak-btn" data-speak="${plain}">▶</button>
    </div>`;
  }).join('');
  const chips = s.vocabWords.map(w=>`<button class="vchip" data-word="${w}">${w}</button>`).join('');
  const properChips = (s.properNouns||[]).map(w=>`<button class="vchip" data-word="${w}">${w}</button>`).join('');
  const grammarHtml = (s.grammarRefs||[]).map(gi=>{
    const g = grammar[gi];
    const more = g.more.map(m=>`<li>${m}</li>`).join('');
    return `<div class="gram-card">
      <div class="gram-title">${g.title}</div>
      <div class="gexample hanzi">${g.example}</div>
      <div class="gexplain">${g.explain}</div>
      <ul class="gmore">${more}</ul>
    </div>`;
  }).join('');
  return `<div class="slide">
    <div class="corner-sticker"><div class="sun"></div><div class="ring"></div><div class="art">${CORNER_STICKER}</div></div>
    <div class="eyebrow">课文 · Bài khóa — chạm vào chữ có gạch chân để xem giải thích từ</div>
    <h2 class="hanzi">${s.title}</h2>
    <div id="dialogueBlock">${lines}</div>
    <div class="dialogue-toolbar">
      <button class="reveal-btn" id="playAll">▶ Phát cả đoạn</button>
      <button class="reveal-btn ghost" id="togglePy">Ẩn phiên âm</button>
      <button class="reveal-btn ghost" id="toggleVi2">Ẩn nghĩa</button>
    </div>
    <div class="chip-row"><span class="chip-label">词语 Từ mới trong bài:</span>${chips}</div>
    ${properChips ? `<div class="chip-row"><span class="chip-label">专有名词 Tên riêng:</span>${properChips}</div>` : ''}
    ${grammarHtml? `<div class="gram-section"><div class="eyebrow">语言点 · Ngữ pháp liên quan</div>${grammarHtml}</div>` : ''}
  </div>`;
}

function renderReorder(s){
  const mkBank = it => [...it.chunks, ...(it.extra||[])].sort(()=>Math.random()-0.5);
  s._state = s._state || reorderItems.map(it=>({answer:[], bank:mkBank(it), checked:false}));
  const items = reorderItems.map((it,i)=>{
    const st = s._state[i];
    const answerHtml = st.answer.length ? st.answer.map((c,ci)=>`<button class="chunk ans" data-i="${i}" data-act="remove" data-ci="${ci}">${c}</button>`).join('') : '<span class="placeholder">Bấm các từ bên dưới theo đúng thứ tự...</span>';
    const bankHtml = st.bank.filter(c=>!st.answer.includes(c)).map(c=>`<button class="chunk bank" data-i="${i}" data-act="add" data-word="${c}">${c}</button>`).join('');
    const isCorrect = st.checked ? JSON.stringify(st.answer)===JSON.stringify(it.chunks) : null;
    return `<div class="reorder-item ${st.checked?(isCorrect?'correct':'wrong'):''}">
      <div class="reorder-idx"><b>${i+1}</b><span>${(it.extra&&it.extra.length)?'có '+it.extra.length+' cụm từ thừa':'&nbsp;'}</span></div>
      <div class="reorder-answer hanzi">${answerHtml}</div>
      <div class="reorder-bank">${bankHtml}</div>
      <div class="reorder-actions">
        <button class="reveal-btn ghost small" data-i="${i}" data-act="reset">↻ Làm lại</button>
        ${st.checked ? `<span class="fb-note" style="color:${isCorrect?'#2F6B7D':'#B3503F'}">${isCorrect?'Chính xác!':'Chưa đúng, thử lại nhé.'}</span>` : `<button class="reveal-btn small" data-i="${i}" data-act="check">Kiểm tra</button>`}
      </div>
    </div>`;
  }).join('');
  return `<div class="slide">
    <div class="corner-sticker"><div class="sun"></div><div class="ring"></div><div class="art">${CORNER_STICKER}</div></div>
    <div class="eyebrow">语序练习 · Sắp xếp câu</div>
    <h2><span class="ex-badge">1</span>${s.title}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin:0;">Bấm các cụm từ theo đúng thứ tự để tạo thành câu hoàn chỉnh, rồi bấm Kiểm tra. <strong>Lưu ý:</strong> mỗi câu có thêm một cụm từ thừa — đừng dùng đến nó.</p>
    <div style="display:flex;flex-direction:column;gap:12px;">${items}</div>
  </div>`;
}

function renderSpeaking(s){
  const cards = [
    {icon:'library', name:'图书馆', q:'图书馆在哪儿？'},
    {icon:'schoolbldg', name:'教学楼', q:'教学楼在哪儿？'},
    {icon:'dorm', name:'宿舍楼', q:'宿舍楼在图书馆的哪边？'},
    {icon:'compass', name:'方位', q:'东边？西边？南边？北边？'}

  const seen = new Set();
  const allVocab = dialogue1Vocab.concat(dialogue2Vocab, dialogue1ProperNouns, dialogue2ProperNouns).filter(w=>{ if(seen.has(w)) return false; seen.add(w); return true; });

      <ul class="speak-guide">

        <li>［Nơi chốn］ + 是 + ［Vật］。　例：教学楼的北边是图书馆。</li>
        <li>［Vật］ + 在哪儿？　→　请问，＿＿在哪儿？</li>
      </ul>
    </div>
    <div class="chip-row"><span class="chip-label">词语 Gợi ý từ vựng:</span>${chips}</div>
  </div>`;
}

function render(){
  const list = activeSlides();
  const idx = getCurrent();
  const s = list[idx];

  document.getElementById('navNew').classList.toggle('active', section==='new');
  document.getElementById('navReview').classList.toggle('active', section==='review');

  document.getElementById('weatherDot').textContent = s.season;
  document.getElementById('weatherDot').style.background = seasonMeta[s.season].accent;
  document.getElementById('weatherLabel').textContent = seasonMeta[s.season].label;
  document.documentElement.style.setProperty('--accent', seasonMeta[s.season].accent);
  document.documentElement.style.setProperty('--accent-soft', seasonMeta[s.season].soft);
  document.getElementById('blob1').style.background = seasonMeta[s.season].accent;
  document.getElementById('blob2').style.background = seasonMeta[s.season].accent;

  let html = '';
  if(s.type==='cover') html = renderCover();
  else if(s.type==='dialogue') html = renderDialogue(s);
  else if(s.type==='reorder') html = renderReorder(s);
  else if(s.type==='fill') html = renderFill(s);
  else if(s.type==='translate') html = renderTranslate(s);
  else if(s.type==='speaking') html = renderSpeaking(s);

  document.getElementById('slideArea').outerHTML = html.replace('class="slide','id="slideArea" class="slide');

  attachEvents(s);
  renderDots();
  renderReviewTabs();
  document.getElementById('prevBtn').disabled = idx===0;
  document.getElementById('nextBtn').disabled = idx===list.length-1;
}

function attachEvents(s){
  document.querySelectorAll('[data-speak]').forEach(btn=>{
    btn.addEventListener('click', ()=>speak(btn.getAttribute('data-speak')));
  });
  const playAll = document.getElementById('playAll');
  if(playAll) playAll.addEventListener('click', ()=>speakSequence(s.lines.map(l=>l.segments.map(sg=>sg.t).join(''))));

  const togglePy = document.getElementById('togglePy');
  if(togglePy) togglePy.addEventListener('click', ()=>{
    const block = document.getElementById('dialogueBlock');
    block.classList.toggle('hide-py');
    togglePy.textContent = block.classList.contains('hide-py') ? 'Hiện phiên âm' : 'Ẩn phiên âm';
  });
  const toggleVi2 = document.getElementById('toggleVi2');
  if(toggleVi2) toggleVi2.addEventListener('click', ()=>{
    const block = document.getElementById('dialogueBlock');
    block.classList.toggle('hide-vi');
    toggleVi2.textContent = block.classList.contains('hide-vi') ? 'Hiện nghĩa' : 'Ẩn nghĩa';
  });

  document.querySelectorAll('[data-act="add"],[data-act="remove"],[data-act="check"],[data-act="reset"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-i'));
      const st = s._state[i];
      const act = btn.getAttribute('data-act');
      if(act==='add'){ st.answer.push(btn.getAttribute('data-word')); }
      else if(act==='remove'){ st.answer.splice(parseInt(btn.getAttribute('data-ci')),1); }
      else if(act==='check'){ st.checked = true; }
      else if(act==='reset'){ const ri=reorderItems[i]; st.answer=[]; st.checked=false; st.bank=[...ri.chunks, ...(ri.extra||[])].sort(()=>Math.random()-0.5); }
      render();
    });
  });


  document.querySelectorAll('[data-act="checkFill"],[data-act="revealFill"],[data-act="resetFill"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const gi = parseInt(btn.getAttribute('data-g'));
      const act = btn.getAttribute('data-act');
      const g = fillItems[gi];
      let right = 0;
      g.items.forEach((it,i)=>{
        const inp = document.getElementById('fIn'+gi+'_'+i);
        const fb  = document.getElementById('fFb'+gi+'_'+i);
        inp.classList.remove('ok','no'); fb.textContent = '';
        if(act==='resetFill'){ inp.value=''; return; }
        if(act==='revealFill'){ inp.value = it.ans; inp.classList.add('ok'); right++; return; }
        const val = normalizeStr(inp.value);
        if(!val){ fb.textContent='—'; fb.style.color='var(--ink-soft)'; return; }
        if(val===normalizeStr(it.ans)){ inp.classList.add('ok'); fb.textContent='✓'; fb.style.color='#2F6B7D'; right++; }
        else { inp.classList.add('no'); fb.textContent='✗'; fb.style.color='#B3503F'; }
      });
      const sc = document.getElementById('fScore'+gi);
      if(act==='resetFill') sc.textContent='';
      else if(act==='revealFill') sc.textContent='Đã điền sẵn đáp án của nhóm này.';
      else sc.textContent = 'Đúng ' + right + '/' + g.items.length + ' câu.';
    });
  });
  document.querySelectorAll('.fill-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault();
      const all=[...document.querySelectorAll('.fill-input')]; const n=all[all.indexOf(inp)+1]; if(n) n.focus(); } });
  });

  document.querySelectorAll('[data-act="revealTranslate"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = btn.getAttribute('data-i');
      const ans = document.getElementById('tAnswer'+i);
      ans.classList.toggle('shown');
      btn.textContent = ans.classList.contains('shown') ? 'Ẩn đáp án' : 'Xem đáp án gợi ý';
    });
  });
  document.querySelectorAll('[data-act="checkTranslate"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = btn.getAttribute('data-i');
      const input = document.getElementById('tInput'+i);
      const fb = document.getElementById('tFeedback'+i);
      const item = document.getElementById('tItem'+i);
      const it = translateItems[i];
      const val = input.value.trim();
      item.classList.remove('t-correct','t-wrong');
      if(!val){ fb.textContent = 'Hãy gõ câu trả lời trước đã nhé.'; fb.style.color = '#B3503F'; return; }
      const norm = normalizeStr(val);
      const isMatch = norm===normalizeStr(it.h) || norm===normalizeStr(it.p);
      if(isMatch){
        fb.textContent = 'Chính xác!'; fb.style.color = '#2F6B7D'; item.classList.add('t-correct');
      } else {
        fb.textContent = 'Chưa khớp đáp án gợi ý — xem thêm để so sánh nhé.'; fb.style.color = '#B3503F'; item.classList.add('t-wrong');
      }
    });
  });
}

function renderDots(){
  const dots = document.getElementById('dots');
  if(section==='review'){ dots.innerHTML=''; return; }
  const list = activeSlides();
  const idx = getCurrent();
  dots.innerHTML = list.map((_,i)=>`<span class="${i===idx?'active':''}" data-i="${i}"></span>`).join('');
  dots.querySelectorAll('span').forEach(d=>d.addEventListener('click', ()=>{ setCurrent(parseInt(d.getAttribute('data-i'))); render(); }));
}

function renderReviewTabs(){
  const el = document.getElementById('reviewTabs');
  if(section!=='review'){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='flex';
  el.innerHTML = slidesReview.map((sl,i)=>`<button class="review-tab ${i===currentReview?'active':''}" data-i="${i}">${sl.tab}</button>`).join('');
  el.querySelectorAll('.review-tab').forEach(b=>b.addEventListener('click', ()=>{ currentReview = parseInt(b.getAttribute('data-i')); render(); }));
}

document.getElementById('prevBtn').addEventListener('click', ()=>{ const i=getCurrent(); if(i>0){ setCurrent(i-1); render(); } });
document.getElementById('nextBtn').addEventListener('click', ()=>{ const i=getCurrent(); const list=activeSlides(); if(i<list.length-1){ setCurrent(i+1); render(); } });
document.addEventListener('keydown', (e)=>{
  const modalOpen = document.getElementById('vocabModal').classList.contains('open');
  if(modalOpen){ if(e.key==='Escape'){ closeVocabModal(); } return; }
  if(document.activeElement && (document.activeElement.tagName==='TEXTAREA' || document.activeElement.tagName==='INPUT')) return;
  const i=getCurrent(); const list=activeSlides();
  if(e.key==='ArrowRight' && i<list.length-1){ setCurrent(i+1); render(); }
  if(e.key==='ArrowLeft' && i>0){ setCurrent(i-1); render(); }
});
document.getElementById('navNew').addEventListener('click', ()=>{ section='new'; render(); });
document.getElementById('navReview').addEventListener('click', ()=>{ section='review'; render(); });

/* ---------- VOCAB MODAL ---------- */
function buildStrokePanel(word){
  const panel = document.getElementById('strokePanel');
  panel.innerHTML='';
  panel._writers = [];
  const chars = Array.from(word);
  const boxSize = 110;
  chars.forEach((ch,i)=>{
    const wrap = document.createElement('div');
    wrap.className='stroke-box';
    const id = 'hw-'+i+'-'+Date.now();
    wrap.innerHTML = `<div class="stroke-target" id="${id}"></div><div class="stroke-char hanzi">${ch}</div>`;
    panel.appendChild(wrap);
    try{
      const writer = HanziWriter.create(id, ch, {
        width: boxSize, height: boxSize, padding:6,
        showOutline:true, strokeAnimationSpeed:1, delayBetweenStrokes:180,
        strokeColor:'#273140', outlineColor:'#DEE2D9', radicalColor:'#8FBF9F'
      });
      panel._writers.push(writer);
      setTimeout(()=>{
        if(typeof writer.loopCharacterAnimation === 'function'){
          writer.loopCharacterAnimation({delayBetweenLoops:900});
        } else {
          writer.animateCharacter();
        }
      }, 300 + i*200);
    }catch(e){ console.warn('HanziWriter lỗi tải chữ', ch, e); }
  });
}

function openVocabModal(word){
  const info = vocabDetails[word];
  if(!info) return;
  document.getElementById('vwHanzi').textContent = word;
  document.getElementById('vwPinyin').textContent = info.p;
  document.getElementById('vwHanviet').textContent = 'Âm Hán Việt: '+info.hv;
  document.getElementById('vwPos').textContent = info.pos;
  document.getElementById('vwMeaning').innerHTML = '<strong>Nghĩa:</strong> '+info.vi;
  document.getElementById('vwUsage').innerHTML = '<strong>Cách dùng:</strong> '+info.usage;
  const radSec = document.getElementById('vwRadicalSection');
  if(info.radical){
    radSec.innerHTML = `<div class="radical-box">
      <div class="radical-badge hanzi">${info.radical.char}</div>
      <div class="radical-text">
        <div class="radical-name">Bộ ${info.radical.name}</div>
        <div class="mnemonic-text">${info.mnemonic||''}</div>
      </div>
      ${info.icon && ICONS[info.icon] ? `<div class="radical-icon">${ICONS[info.icon]}</div>` : ''}
    </div>`;
  } else {
    radSec.innerHTML = info.mnemonic ? `<div class="mnemonic-text">${info.mnemonic}</div>` : '';
  }
  document.getElementById('vwExamples').innerHTML = info.examples.map(ex=>`<div class="ex-item"><div class="hanzi ex-h">${ex.h}</div><div class="ex-p">${ex.p}</div><div class="ex-vi">${ex.vi}</div></div>`).join('');
  buildStrokePanel(word);
  const modal = document.getElementById('vocabModal');
  modal.style.display='flex';
  requestAnimationFrame(()=> requestAnimationFrame(()=> modal.classList.add('open')));
}
function closeVocabModal(){
  const modal = document.getElementById('vocabModal');
  modal.classList.remove('open');
  setTimeout(()=>{ if(!modal.classList.contains('open')) modal.style.display='none'; }, 320);
}

document.addEventListener('click', (e)=>{
  const w = e.target.closest('.vword,.vchip');
  if(w){ openVocabModal(w.getAttribute('data-word')); return; }
  if(e.target.id==='vmodalClose' || e.target.classList.contains('vmodal-backdrop')){ closeVocabModal(); }
});

render();

/* ---------- TRÌNH CHIẾU TOÀN MÀN HÌNH (fullscreen presentation) ---------- */
function enterPresentation(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req){ req.call(el).catch(()=>{ document.body.classList.add('presentation'); }); }
  else { document.body.classList.add('presentation'); }
}
function exitPresentation(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    document.body.classList.remove('presentation');
  }
}
function onFullscreenChange(){
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.toggle('presentation', isFs);
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
document.getElementById('fsBtn').addEventListener('click', enterPresentation);
document.getElementById('fsExit').addEventListener('click', exitPresentation);
</script>
